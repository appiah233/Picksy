name: Picksy SAST

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "sanity.config.*"
      - "sanity.cli.*"
      - ".github/workflows/security-sast.yml"
      - ".github/scripts/check-dependency-audit.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "sanity.config.*"
      - "sanity.cli.*"
      - ".github/workflows/security-sast.yml"
      - ".github/scripts/check-dependency-audit.py"
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Audit production dependency tree
        run: |
          set +e
          npm audit --omit=dev --json > dependency-audit.json
          audit_status=$?
          set -e
          test -s dependency-audit.json
          python3 .github/scripts/check-dependency-audit.py dependency-audit.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14

